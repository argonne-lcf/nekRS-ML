[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nekrs-ml-agentic"
version = "0.1.0"
description = "Login-node-safe Globus Compute functions and Claude skills for driving nekRS-ML on HPC from a laptop agent."
requires-python = ">=3.10"
dependencies = [
    "globus-compute-sdk>=2.27",
]

[project.optional-dependencies]
endpoint = [
    "globus-compute-endpoint>=2.27",
]
dev = [
    "pytest>=7",
]

# Need to explicitly enumerate the packages and pin their source dirs via package-dir. 
[tool.setuptools]
packages = [
    "agentic",
    "agentic.client",
    "agentic.globus_endpoints",
    "agentic.tests",
]

[tool.setuptools.package-dir]
"agentic" = "."
"agentic.client" = "client"
"agentic.globus_endpoints" = "globus_endpoints"
"agentic.tests" = "tests"
