# Globus Compute endpoint config for an Aurora login-node endpoint.
#
# LocalProvider runs functions in worker processes on whichever node the
# endpoint was started. We deliberately start the endpoint on a login node
# and keep concurrency low: the worker pool exists to wrap qsub / qstat /
# cmake / cp, never to run mpiexec. Compute jobs go through submit_job,
# which qsubs onto compute nodes.
#
# Tunables:
#   max_workers_per_node: small (2) so a runaway loop can't fork a swarm
#     of subprocess shells on the login node. Increase only after measuring.
#   idle_heartbeats_*: keep the endpoint chatty enough that the Globus
#     service notices when the login node reboots and the endpoint dies.
#
# Apply via:
#   globus-compute-endpoint configure nekrs-ml-aurora
#   cp <this file> ~/.globus_compute/nekrs-ml-aurora/config.yaml
#   globus-compute-endpoint start nekrs-ml-aurora

display_name: nekRS-ML Aurora login endpoint
engine:
  type: GlobusComputeEngine
  max_workers_per_node: 2
  provider:
    type: LocalProvider
    init_blocks: 1
    min_blocks: 0
    max_blocks: 1
idle_heartbeats_soft: 10
idle_heartbeats_hard: 5760
